<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tra cứu mã sản phẩm</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Anton&family=DM+Sans:wght@300;400;500;600;700&display=swap');

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --blue:#1a6ef5;
      --blue-dark:#0d4ab5;
      --pink:#f5a8c3;
      --white:#fff;
      --dark:#0f172a;
    }

    body{
      font-family:'DM Sans',sans-serif;
      background:#fff;
      color:var(--dark);
    }

    nav{
      height:64px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 5%;
      border-bottom:1px solid rgba(0,0,0,.06);
    }

    .nav-links{
      display:flex;
      gap:30px;
      list-style:none;
    }

    .nav-links a{
      text-decoration:none;
      color:#444;
      font-weight:600;
      cursor:pointer;
    }

    .nav-search{
      display:flex;
      gap:8px;
    }

    .nav-search input{
      padding:10px 14px;
      border-radius:999px;
      border:1px solid #ddd;
      outline:none;
    }

    .nav-search button{
      padding:10px 16px;
      border:none;
      border-radius:999px;
      background:var(--blue);
      color:#fff;
      cursor:pointer;
      font-weight:700;
    }

    .page{
      padding-top:20px;
    }

    .hero{
      min-height:120px;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .hero-cta{
      display:flex;
      gap:14px;
    }

    .btn-primary,
    .btn-outline{
      padding:14px 28px;
      border-radius:999px;
      font-weight:700;
      cursor:pointer;
    }

    .btn-primary{
      border:none;
      background:var(--blue);
      color:#fff;
    }

    .btn-outline{
      background:#fff;
      border:1px solid #ddd;
    }

    .section{
      padding:30px 5%;
    }

    .section-header{
      display:flex;
      justify-content:flex-end;
      margin-bottom:20px;
    }

    .section-link{
      color:var(--blue);
      font-weight:700;
      cursor:pointer;
    }

    .categories{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }

    .category-card{
      position:relative;
      aspect-ratio:16/9;
      border-radius:26px;
      overflow:hidden;
      cursor:pointer;
    }

    .category-shirt{
      background:linear-gradient(180deg,#dce9ff,#004fd6);
    }

    .category-pants{
      background:linear-gradient(180deg,#f7dfe8,#e56f9c);
    }

    .category-overlay{
      position:absolute;
      inset:0;
      display:flex;
      align-items:flex-end;
      padding:36px;
      background:linear-gradient(to top,rgba(0,0,0,.18),transparent);
    }

    /* FIX FONT TIẾNG VIỆT */
    .category-name{
      font-family:'Anton',sans-serif;
      font-size:58px;
      color:#fff;
      line-height:1;
      letter-spacing:.02em;
    }

    .section-label{
      color:var(--blue);
      font-weight:700;
      margin-bottom:6px;
      text-transform:uppercase;
    }

    .section-title{
      font-family:'Anton',sans-serif;
      font-size:74px;
      line-height:1;
    }

    .products-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
      gap:24px;
      margin-top:20px;
    }

    .product-card{
      border-radius:20px;
      overflow:hidden;
      border:1px solid #eee;
    }

    .product-image{
      aspect-ratio:2/3;
      background:#f5f5f5;
    }

    .product-image img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .product-body{
      padding:14px;
    }

    .code-label{
      font-size:11px;
      font-weight:700;
      color:#777;
      text-transform:uppercase;
    }

    .code-value{
      display:inline-block;
      margin-top:6px;
      padding:6px 10px;
      border-radius:8px;
      background:#f3f4f6;
      font-weight:700;
    }

    @media(max-width:768px){
      .categories{
        grid-template-columns:1fr;
      }

      .category-name{
        font-size:44px;
      }

      .section-title{
        font-size:56px;
      }

      .products-grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<nav>
  <ul class="nav-links">
    <li><a>Trang chủ</a></li>
    <li><a>Sản phẩm</a></li>
  </ul>

  <div class="nav-search">
    <input type="text" placeholder="Nhập mã SP...">
    <button>Tìm</button>
  </div>
</nav>

<main class="page">

  <section class="hero">
    <div class="hero-cta">
      <button class="btn-primary">Xem sản phẩm →</button>
      <button class="btn-outline">Khám phá ngay</button>
    </div>
  </section>

  <section class="section">

    <div class="section-header">
      <div class="section-link">Tất cả →</div>
    </div>

    <div class="categories">

      <div class="category-card category-shirt">
        <div class="category-overlay">
          <div class="category-name">ÁO & VÁY</div>
        </div>
      </div>

      <div class="category-card category-pants">
        <div class="category-overlay">
          <div class="category-name">QUẦN</div>
        </div>
      </div>

    </div>
  </section>

  <section class="section">

    <div>
      <div class="section-label">Tùy chọn</div>
      <h2 class="section-title">TÙY CHỌN</h2>
    </div>

    <div class="products-grid">

      <div class="product-card">
        <div class="product-image">
          <img src="images/AO-001.jpg">
        </div>

        <div class="product-body">
          <div class="code-label">Mã SP</div>
          <div class="code-value">AO-001</div>
        </div>
      </div>

      <div class="product-card">
        <div class="product-image">
          <img src="images/QP-001.jpg">
        </div>

        <div class="product-body">
          <div class="code-label">Mã SP</div>
          <div class="code-value">QP-001</div>
        </div>
      </div>

    </div>

  </section>

</main>

</body>
</html>
