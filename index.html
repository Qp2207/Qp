<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Vocabulary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>English Vocabulary</h1>
        <p>Học từ mới theo bài và kiểm tra nhanh</p>
      </div>
      <button id="reloadBtn" class="secondary">Cập nhật từ GitHub</button>
    </header>

    <main>
      <!-- MÀN HÌNH CHỌN BÀI HỌC VÀ CHỨC NĂNG -->
      <section id="setup" class="card">
        <h2>Danh sách bài học</h2>
        <p class="guide-text">Chọn một bài học để xem tùy chọn chức năng:</p>
        
        <!-- Danh sách bài học sẽ render ở đây dưới dạng các nhánh con -->
        <div id="lessonList" class="lesson-accordion"></div>

        <p id="status" class="status"></p>
      </section>

      <!-- MÀN HÌNH XEM TỪ VỰNG TRONG BÀI -->
      <section id="viewWords" class="card hidden">
        <div class="quiz-head">
          <button id="backFromViewBtn" class="secondary">← Quay lại</button>
          <h2 id="viewLessonTitle" style="margin:0;">Tên bài học</h2>
        </div>
        <div class="words-table-container">
          <table class="words-table">
            <thead>
              <tr>
                <th>STT</th>
                <th>Từ tiếng Anh</th>
                <th>Nghĩa tiếng Việt</th>
              </tr>
            </thead>
            <tbody id="wordsTableBody"></tbody>
          </table>
        </div>
      </section>

      <!-- MÀN HÌNH LÀM BÀI TẬP (QUIZ) -->
      <section id="quiz" class="card hidden">
        <div class="quiz-head">
          <button id="backBtn" class="secondary">← Chọn lại</button>
          <span id="progress"></span>
        </div>

        <div class="question-box">
          <div id="questionType" class="question-type"></div>
          <div id="question" class="question"></div>
        </div>

        <form id="answerForm">
          <input id="answer" autocomplete="off" placeholder="Nhập câu trả lời..." required>
          <button class="primary" type="submit">Kiểm tra</button>
        </form>

        <div id="feedback" class="feedback"></div>
        <button id="nextBtn" class="primary hidden">Câu tiếp theo →</button>
      </section>

      <!-- MÀN HÌNH KẾT QUẢ -->
      <section id="result" class="card hidden">
        <h2>Hoàn thành!</h2>
        <div id="scoreCircle" class="score-circle"></div>
        <div id="resultText" class="result-text"></div>
        <div class="result-stats">
          <div><span id="correctCount">0</span><small>Đúng</small></div>
          <div><span id="wrongCount">0</span><small>Sai</small></div>
          <div><span id="totalCount">0</span><small>Tổng số</small></div>
        </div>
        <button id="retryBtn" class="primary">Làm lại</button>
      </section>
    </main>

    <footer>
      Dữ liệu từ vựng được tải trực tiếp từ file JSON trên GitHub.
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
