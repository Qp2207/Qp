<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Vocabulary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>English Vocabulary</h1>
        <p>Học từ mới theo bài và kiểm tra nhanh</p>
      </div>
      <button id="reloadBtn" class="secondary">Cập nhật từ GitHub</button>
    </header>

    <main>
      <section id="setup" class="card">
        <h2>Chọn bài học</h2>
        <div id="lessonList" class="lesson-grid"></div>

        <h2 class="mode-title">Chọn chức năng</h2>
        <div class="mode-grid">
          <button class="mode-card" data-mode="meaning-to-word">
            <strong>Nghĩa → Từ tiếng Anh</strong>
            <span>Trang đưa ra nghĩa, bạn nhập từ tiếng Anh.</span>
          </button>
          <button class="mode-card" data-mode="word-to-meaning">
            <strong>Từ tiếng Anh → Nghĩa</strong>
            <span>Trang đưa ra từ tiếng Anh, bạn nhập nghĩa.</span>
          </button>
        </div>

        <div class="random-row">
          <label>
            <input type="checkbox" id="randomMode">
            Random từ trong bài
          </label>
          <label>
            Số câu:
            <select id="questionCount">
              <option value="5">5</option>
              <option value="10" selected>10</option>
              <option value="20">20</option>
              <option value="all">Tất cả</option>
            </select>
          </label>
        </div>

        <button id="startBtn" class="primary start-btn">Bắt đầu</button>
        <p id="status" class="status"></p>
      </section>

      <section id="quiz" class="card hidden">
        <div class="quiz-head">
          <button id="backBtn" class="secondary">← Chọn lại</button>
          <span id="progress"></span>
        </div>

        <div class="question-box">
          <div id="questionType" class="question-type"></div>
          <div id="question" class="question"></div>
        </div>

        <form id="answerForm">
          <input id="answer" autocomplete="off" placeholder="Nhập câu trả lời..." required>
          <button class="primary" type="submit">Kiểm tra</button>
        </form>

        <div id="feedback" class="feedback"></div>
        <button id="nextBtn" class="primary hidden">Câu tiếp theo →</button>
      </section>

      <section id="result" class="card hidden">
        <h2>Hoàn thành!</h2>
        <div id="scoreCircle" class="score-circle"></div>
        <div id="resultText" class="result-text"></div>
        <div class="result-stats">
          <div><span id="correctCount">0</span><small>Đúng</small></div>
          <div><span id="wrongCount">0</span><small>Sai</small></div>
          <div><span id="totalCount">0</span><small>Tổng số</small></div>
        </div>
        <button id="retryBtn" class="primary">Làm lại</button>
      </section>
    </main>

    <footer>
      Dữ liệu từ vựng được tải trực tiếp từ file JSON trên GitHub.
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
